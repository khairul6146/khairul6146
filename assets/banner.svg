<svg width="850" height="220" viewBox="0 0 850 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="850" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#30363d" stroke-width="0.7" stroke-opacity="0.35" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card with Border -->
  <rect x="1" y="1" width="848" height="218" rx="14" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" />
  <rect x="1" y="1" width="848" height="218" rx="14" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="80" cy="50" r="70" fill="#38bdf8" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="780" cy="170" r="90" fill="#a855f7" fill-opacity="0.09" filter="url(#glow)" />

  <!-- Status Indicator Badge -->
  <g transform="translate(50, 36)">
    <rect width="186" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="14" cy="13" r="4.5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="17" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.5">IN THE LAB • LEARNING &amp; BUILDING</text>
  </g>

  <!-- Name / Title -->
  <text x="50" y="106" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="0.5">
    Khairul Akmal
  </text>

  <!-- Role Subtitle -->
  <text x="50" y="138" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="0.2">
    Software Craftsman • Lifelong Learner • Building in Public
  </text>

  <!-- Workshop Stack Pills -->
  <text x="50" y="174" fill="#7ee787" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="12" font-weight="500">
    <tspan fill="#58a6ff">~/workshop </tspan>
    <tspan fill="#8b949e">&gt; </tspan>
    <tspan fill="#e6edf3">Next.js</tspan>
    <tspan fill="#6e7681"> • </tspan>
    <tspan fill="#e6edf3">FastAPI</tspan>
    <tspan fill="#6e7681"> • </tspan>
    <tspan fill="#e6edf3">TypeScript</tspan>
    <tspan fill="#6e7681"> • </tspan>
    <tspan fill="#e6edf3">Python</tspan>
    <tspan fill="#6e7681"> • </tspan>
    <tspan fill="#e6edf3">PowerShell</tspan>
    <tspan fill="#6e7681"> • </tspan>
    <tspan fill="#e6edf3">AI Workflows</tspan>
  </text>

  <!-- Decorative Corner Code Icon Graphic -->
  <g transform="translate(730, 42)" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.45">
    <polyline points="16 18 22 12 16 6" />
    <polyline points="8 6 2 12 8 18" />
  </g>
  <g transform="translate(715, 110)" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.3">
    <rect x="0" y="0" width="68" height="42" rx="6" fill="none" stroke="#30363d" />
    <line x1="12" y1="13" x2="56" y2="13" />
    <line x1="12" y1="21" x2="42" y2="21" />
    <line x1="12" y1="29" x2="28" y2="29" />
  </g>
</svg>
